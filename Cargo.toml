[package]
name = "la_taupe"
version = "0.1.0"
edition = "2021"
rust-version = "1.95.0"
license-file = "LICENSE.txt"
description = "La Taupe is a tool to extract administrative data from documents."
authors = ["See git log"]
build = "build.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
actix-web = "*"
rxing = "*"
nom = "*"
chrono = { version = "*", features = ["serde"] }
p256 = "*"
x509-cert = "*"
base32 = "*"
iban_validate = "*"
itertools = "*"
image = "*"
imageproc = "*"
tempfile = "*"
log = "*"
linfa = "*"
linfa-clustering = "*"
ndarray = "*"
env_logger = "*"
regex = "*"
scraper = "*"
serde = { version = "*", features = ["derive"] }
serde-xml-rs = "*"
serde_json = "*"
tree_magic_mini = "*"
reqwest = { version = "*", features = ["json", "blocking"] }
url = "*"
ocrs = "0.11"
rten = "0.22"
# PP-OCR (PaddleOCR) via ONNX Runtime, CPU only. Default engine since it is
# both more accurate and 3-4x faster than ocrs on the real corpus. ocrs stays
# available as a fallback engine (LA_TAUPE_OCR_ENGINE=ocrs).
# ONNX Runtime is fetched at build time and linked statically; the models are
# fetched at build time by download-models.sh and embedded with include_bytes!.
# The binary is self-contained: nothing is downloaded at runtime.
oar-ocr = { version = "0.9", default-features = false, features = ["download-binaries", "simd"] }
rten-imageproc = "0.22"

[features]
# Outillage de mesure (generateur de corpus synthetique + banc). Hors du binaire de prod.
bench = []

[[bin]]
name = "synth"
required-features = ["bench"]

[[bin]]
name = "bench"
required-features = ["bench"]

[dev-dependencies]
assert_cmd = "*"
static_init = "*"
serial_test = "*"

[package.metadata.deb]
depends = "poppler-utils, tesseract-ocr, tesseract-ocr-fra"
